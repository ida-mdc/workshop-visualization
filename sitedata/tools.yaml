# The tool tables, as data rather than as markdown in one slide.
#
# Three slides ask the same question of the same tools, and other decks ask it
# again, so the list lives here and the {{< tools >}} shortcode renders it.
# Adding a tool is one entry; it shows up wherever its `kind` is rendered.
#
#   kind      desktop | library | browser - which slide it appears on
#   voxels    what the tool does with that data type, as a table cell:
#   meshes      "X"      a first-class object for it
#   points      "<text>" supported, but with the limitation spelled out
#   vectors     ""       not supported
#   good_for  the column that actually decides which tool you open
#
# Link every tool from its own name. The name is rendered as markdown, so a
# row with several tools in it gets several links - and a reader who wants
# one of them does not have to go and search for it.
#
# Open source only. Not because the commercial packages are bad, but because
# we support scientists across all domains and a tool nobody can install is
# not an answer - see the speaker notes on the tools slide.


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect x="0" y="0" width="560" height="272" fill="#fbfbfd" stroke="#9a9aa4" stroke-width="1" rx="6"/><text x="16" y="32" font-size="15.5" fill="#232430" font-weight="700" xml:space="preserve">sample.ome.zarr/</text><text x="16" y="56" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">├── .zattrs</text><text x="544" y="56" font-size="12.5" fill="#0059a0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">multiscales metadata: axes, levels, transforms</text><text x="16" y="80" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">├── .zgroup</text><text x="16" y="104" font-size="15.5" fill="#232430" font-weight="700" xml:space="preserve">├── 0/</text><text x="544" y="104" font-size="12.5" fill="#1f7a8c" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">full resolution</text><text x="16" y="128" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">│   ├── .zarray</text><text x="544" y="128" font-size="12.5" fill="#9a9aa4" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">shape, dtype, chunk shape</text><text x="16" y="152" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">│   └── 0.0.0, 0.0.1, 0.0.2, …</text><text x="544" y="152" font-size="12.5" fill="#e2a13c" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">one file per chunk</text><text x="16" y="176" font-size="15.5" fill="#232430" font-weight="700" xml:space="preserve">├── 1/</text><text x="544" y="176" font-size="12.5" fill="#1f7a8c" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">half resolution</text><text x="16" y="200" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">│   └── … same layout, fewer chunks</text><text x="16" y="224" font-size="15.5" fill="#232430" font-weight="700" xml:space="preserve">└── 2/</text><text x="544" y="224" font-size="12.5" fill="#1f7a8c" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">quarter resolution</text><text x="16" y="248" font-size="15.5" fill="#232430" font-weight="400" xml:space="preserve">    └── … same layout, fewer still</text></svg>

name: GitHub Pages Deployment

on:
  push:
    branches:
      - main  # Triggers the workflow on pushes to the main branch
  workflow_dispatch:

# Deploys straight from the workflow run, so there is no gh-pages branch.
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The edition being worked on is params.edition in config.toml; archived
  # editions are the workshop-<year> tags. Neither is repeated here.
  BASE: 'https://ida-mdc.github.io/workshop-visualization'
  REPO: 'ida-mdc/workshop-visualization'
  # Whether the edition being worked on is ready to go public. While this is
  # 'false' only the landing page, the archived editions and /draft/ are
  # published; ./preview.sh always builds the current edition so you can work
  # on it. Flip to 'true' when it should go live, and link it from
  # landing/index.html.
  PUBLISH_CURRENT: 'false'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true   # the theme is a submodule
          fetch-depth: 0     # archived editions are built from their tags

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'  # Match the Hugo version used locally
          extended: false

      # /draft/ is built on every run, published, and linked from nowhere -
      # a URL to send a reviewer while an edition is still being written.
      # See EDITIONS.md.
      - name: Build site
        run: |
          if [ "$PUBLISH_CURRENT" = "true" ]; then
            tools/build-site.sh site "$BASE" --with-current --with-draft
          else
            tools/build-site.sh site "$BASE" --with-draft
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

{{- /* Overrides the theme's home.html so the footer year follows the edition
       instead of being hardcoded. Otherwise identical. */ -}}
{{ define "main" }}
<div class="reveal-header">
    <img src="{{ "img/RZ_211119_Helmholtz-Imaging_Image-Mark_4C_Black.png" | relURL }}" height="40px" alt="Helmholtz Imaging Logo"/>
  </div>
<div class="home" id="page-content">
    <div class="limited-width">
      {{ .Content }}
    </div>
</div>

<div class="reveal-footer">
  <span>{{ site.Params.edition | default (now.Format "2006") }}</span> | <span><b>HELMHOLTZ IMAGING</b></span>
</div>
{{ end }}
